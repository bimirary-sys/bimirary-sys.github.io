<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>건강수첩 관리</title>
<meta name="theme-color" content="#fff4bf">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{--mint:#c4ead8;--mint2:#e3f5ec;--mintInk:#3d7a63;--lemon:#ffe57c;--lemonSoft:#fff8d9;--red:#ec8d86;--redInk:#d9645c;--cream:#fffdf6;--ink:#4a3a44;--sub:#8a7a84;--line:#efe6cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--lemonSoft);color:var(--ink);font:15px/1.5 "Gowun Dodum",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(env(safe-area-inset-bottom) + 120px)}
.j{font-family:Jua,sans-serif;font-weight:400}
/* lock screen */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.lockbox{width:100%;max-width:360px;background:#fff;border-radius:26px;padding:26px 22px;box-shadow:0 10px 30px rgba(170,140,60,.18);text-align:center}
.lockbox h1{margin:6px 0 4px;font:400 24px Jua,sans-serif}
.lockbox p{margin:0 0 16px;color:var(--sub);font-size:14px}
.field{display:block;text-align:left;margin:0 0 12px}
.field span{display:block;font:14px Jua,sans-serif;margin:0 0 5px}
.field small{display:block;color:var(--sub);font-size:12px;margin-top:4px;line-height:1.45}
.inp{width:100%;border:2px solid #f0e2a8;background:var(--cream);border-radius:14px;padding:11px 12px;outline:none}
.inp:focus{border-color:var(--lemon);background:#fff}
textarea.inp{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 16px;font:16px Jua,sans-serif;text-decoration:none}
.btn.pri{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--redInk)}
.btn.pri:active{transform:translateY(2px);box-shadow:0 1px 0 var(--redInk)}
.btn.sec{background:#f4eedb;color:var(--ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{border:0;background:none;color:var(--sub);text-decoration:underline;font-size:13px;margin-top:12px}
.err{color:var(--redInk);font-size:13px;min-height:18px;margin:4px 0 8px}
.steps{text-align:left;background:var(--mint2);border-radius:14px;padding:10px 12px 10px 30px;margin:0 0 14px;font-size:13px;line-height:1.6}
.steps a{color:var(--mintInk);font-weight:700}
/* header */
header{position:sticky;top:0;z-index:5;background:rgba(255,248,217,.94);backdrop-filter:blur(6px);border-bottom:1px solid #f1e5b4}
.hd{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px}
.hd h1{flex:1;margin:0;font:400 19px Jua,sans-serif}
.chip{border:0;background:#fff;border-radius:999px;padding:7px 12px;font:13px Jua,sans-serif;color:var(--ink);text-decoration:none;box-shadow:0 1px 4px rgba(170,140,60,.15)}
.tabs{display:flex;gap:6px;max-width:560px;margin:0 auto;padding:0 14px 10px}
.tab{flex:1;border:0;border-radius:12px;padding:9px;background:#f4eedb;font:15px Jua,sans-serif;color:var(--sub)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(170,140,60,.15)}
.hint{color:var(--sub);font-size:12.5px;margin:12px 2px 10px}
/* block cards */
.list{display:grid;gap:10px}
.card{display:flex;background:#fff;border-radius:18px;box-shadow:0 2px 0 #f3e8c2,0 6px 14px rgba(170,140,60,.08);position:relative;touch-action:pan-y}
.card.off{opacity:.55}
.card.drag{z-index:4;box-shadow:0 14px 30px rgba(120,100,40,.28);transition:none;opacity:.97}
.side{flex:none;width:34px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 0;border-right:1px solid #f6efd6;color:#c9bb8a}
.side button{border:0;background:none;color:#c9bb8a;font-size:12px;padding:4px 8px;line-height:1}
.side button:disabled{opacity:.3}
.grip{touch-action:none;cursor:grab;font-size:18px;letter-spacing:-2px;padding:6px 4px;user-select:none;-webkit-user-select:none}
.main{flex:1;min-width:0;padding:10px 10px 12px 12px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font:12px Jua,sans-serif;color:var(--ink)}
.tag b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;color:#fff;font:400 11px Jua,sans-serif}
.tag.text b{background:#7cc8a5}.tag.link b{background:var(--red)}
.top .sp{flex:1}
.sw{position:relative;width:40px;height:24px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:12px;background:#e4dcc2;transition:background .2s;pointer-events:none}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked+i{background:#6fbf98}
.sw input:checked+i:after{transform:translateX(16px)}
.more{border:0;background:none;font-size:20px;line-height:1;padding:2px 6px;color:#a99}
.body{display:flex;align-items:center;gap:10px;min-width:0}
.thumb{flex:none;width:46px;height:46px;border-radius:12px;overflow:hidden;background:var(--mint2);display:grid;place-items:center;color:var(--mintInk);font:16px Jua,sans-serif;box-shadow:inset 0 0 0 1.5px #e8dcae}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.txt{min-width:0;flex:1}
.ttl{font:16px/1.3 Jua,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.textb{font:16px/1.4 Jua,sans-serif;background:linear-gradient(transparent 58%,var(--mint) 58%);display:inline}
.arch{display:flex;gap:6px;margin-top:10px}
.arch .btn{padding:8px 12px;font-size:14px}
.empty{text-align:center;color:var(--sub);padding:34px 10px;border:2px dashed #eadfb5;border-radius:18px;background:var(--cream)}
/* floating controls */
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(env(safe-area-inset-bottom) + 86px);z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:30px;line-height:56px;box-shadow:0 6px 16px rgba(217,100,92,.4)}
.pv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:6;border:0;border-radius:999px;padding:10px 18px;background:#fff;font:15px Jua,sans-serif;box-shadow:0 4px 14px rgba(120,100,40,.2)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#fff;border-top:1px solid #f1e5b4;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px)}
.savebar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.savebar .msg{flex:1;font-size:13px;color:var(--sub)}
.savebar .msg b{color:var(--ink);font-family:Jua,sans-serif;font-weight:400}
/* sheets */
.dim{position:fixed;inset:0;z-index:10;background:rgba(74,58,68,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;max-height:90vh;overflow-y:auto;background:var(--cream);border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,1,.3,1)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:#eadfb5;margin:0 auto 10px}
.sheet h2{margin:2px 0 14px;font:400 20px Jua,sans-serif;text-align:center}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.pick button{border:2px solid #f0e2a8;background:#fff;border-radius:18px;padding:18px 10px;font:17px Jua,sans-serif}
.pick button small{display:block;font:12px "Gowun Dodum",sans-serif;color:var(--sub);margin-top:4px}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.menu{display:grid;gap:8px}
.menu button{border:0;background:#fff;border-radius:14px;padding:14px;font:16px Jua,sans-serif;text-align:left}
.menu .danger{color:var(--redInk)}
.imgbox{display:flex;gap:12px;align-items:center}
.crop{position:relative;width:150px;height:150px;border-radius:18px;overflow:hidden;background:var(--mint2);flex:none;touch-action:none;box-shadow:inset 0 0 0 2px #e8dcae}
.crop canvas{width:100%;height:100%;display:block}
.crop .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--mintInk);font:14px Jua,sans-serif;text-align:center;padding:10px}
.imgctl{flex:1;display:grid;gap:8px}
.imgctl input[type=range]{width:100%}
.swrow{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;font:15px Jua,sans-serif}
/* preview */
#pvWrap{position:fixed;inset:0;z-index:20;background:rgba(74,58,68,.55);display:none;align-items:center;justify-content:center;padding:14px}
#pvWrap.on{display:flex}
#pvWrap .ph{position:relative;width:min(400px,100%);height:min(820px,calc(100vh - 28px));border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 0 0 8px #fff,0 20px 50px rgba(0,0,0,.3)}
#pvWrap iframe{width:100%;height:100%;border:0;display:block}
#pvClose{position:absolute;right:10px;top:40px;z-index:2;border:0;border-radius:999px;padding:8px 14px;background:rgba(74,58,68,.85);color:#fff;font:14px Jua,sans-serif}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);z-index:30;background:rgba(74,58,68,.92);color:#fff;padding:11px 16px;border-radius:14px;font:15px Jua,sans-serif;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>

<!-- ============ 잠금 화면 ============ -->
<section id="lock">
  <div class="lockbox" id="unlockBox">
    <div style="font-size:38px">📒</div>
    <h1>건강수첩 관리</h1>
    <p>비밀번호를 넣으면 열려요</p>
    <label class="field"><input class="inp" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호"></label>
    <div class="err" id="unlockErr"></div>
    <button class="btn pri wide" id="unlockBtn" type="button">열기</button>
    <button class="linkbtn" id="toSetup" type="button">처음이에요 · 열쇠 다시 등록하기</button>
  </div>
  <div class="lockbox" id="setupBox" hidden>
    <div style="font-size:38px">🔑</div>
    <h1>열쇠 등록하기</h1>
    <p>처음 한 번만 하면 돼요</p>
    <ol class="steps">
      <li><a id="tokLink" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub 열쇠 만들기 페이지</a>를 열어요.</li>
      <li>저장소는 <b>bimirary-sys.github.io</b> 하나만, 권한은 <b>Contents: Read and write</b>로 만들어요.</li>
      <li>만들어진 <b>github_pat_…</b> 글자를 복사해서 아래에 붙여 넣어요.</li>
    </ol>
    <label class="field"><span>GitHub 열쇠(토큰)</span><input class="inp" id="tok" type="password" autocomplete="off" placeholder="github_pat_…"></label>
    <label class="field"><span>관리 비밀번호</span><input class="inp" id="pw1" type="password" autocomplete="new-password" placeholder="10자 이상, 영문+숫자"><small>이 비밀번호로 열쇠를 잠가서 저장해요. 잊어버리면 열쇠를 새로 만들어 다시 등록하면 돼요.</small></label>
    <label class="field"><input class="inp" id="pw2" type="password" autocomplete="new-password" placeholder="비밀번호 한 번 더"></label>
    <div class="err" id="setupErr"></div>
    <button class="btn pri wide" id="setupBtn" type="button">등록하고 열기</button>
    <button class="linkbtn" id="toUnlock" type="button">← 비밀번호로 열기</button>
  </div>
</section>

<!-- ============ 관리 화면 ============ -->
<div id="app" hidden>
  <header>
    <div class="hd"><h1>📒 건강수첩 관리</h1><a class="chip" href="../" target="_blank" rel="noopener">수첩 열기 ↗</a><button class="chip" id="lockBtn" type="button">잠그기</button></div>
    <div class="tabs"><button class="tab on" id="tabList" type="button">블록 리스트</button><button class="tab" id="tabArch" type="button">보관함</button></div>
  </header>
  <main class="wrap">
    <p class="hint" id="hint">⠿ 손잡이를 끌거나 ▲▼로 순서를 바꿔요. 스위치를 끄면 수첩에서 숨겨져요.</p>
    <div class="list" id="list"></div>
  </main>
  <button class="pv" id="pvBtn" type="button">미리보기</button>
  <button class="fab" id="addBtn" type="button" aria-label="블록 추가">+</button>
  <div class="savebar"><div class="in"><div class="msg" id="saveMsg">바뀐 내용이 없어요</div><button class="btn pri" id="saveBtn" type="button" disabled>저장하기</button></div></div>
</div>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="pvWrap"><div class="ph"><button id="pvClose" type="button">닫기 ✕</button><iframe id="pvFrame" title="수첩 미리보기"></iframe></div></div>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script>
(() => {
const OWNER = 'bimirary-sys', REPO = 'bimirary-sys.github.io', BRANCH = 'main';
const DATA_PATH = 'note/links.json', KEY_PATH = 'note/admin/key.json', IMG_DIR = 'note/img/';
const API = 'https://api.github.com/repos/' + OWNER + '/' + REPO;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let tt; const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2200); };

/* ---------- crypto: the GitHub token is stored encrypted with the admin password ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => { let s = ''; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt, iter) { const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); }
async function lockToken(token, pw) { const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 400000;
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(pw, salt, iter), enc.encode(token));
  return { v: 1, kdf: 'PBKDF2-SHA256', iter, salt: b64(salt), iv: b64(iv), ct: b64(ct) }; }
async function unlockToken(box, pw) { const key = await deriveKey(pw, unb64(box.salt), box.iter);
  return dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv) }, key, unb64(box.ct))); }

/* ---------- GitHub API ---------- */
let TOKEN = null;
async function gh(path, opt = {}) {
  const r = await fetch(path.startsWith('http') ? path : API + path, Object.assign({}, opt, { headers: Object.assign({ Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}, opt.body ? { 'Content-Type': 'application/json' } : {}) }));
  if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; try { e.detail = (await r.json()).message; } catch (x) {} throw e; }
  return r.status === 204 ? null : r.json(); }
const b64utf8 = s => b64(enc.encode(s));
const fromB64utf8 = s => dec.decode(unb64(s.replace(/\n/g, '')));
async function readKeyBox() { // public read, no token needed
  try { const j = await fetch(API + '/contents/' + KEY_PATH + '?ref=' + BRANCH + '&t=' + Date.now(), { headers: { Accept: 'application/vnd.github+json' } });
    if (j.ok) return JSON.parse(fromB64utf8((await j.json()).content)); } catch (e) {}
  try { const r = await fetch('key.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (e) {}
  return null; }
async function checkToken() { const repo = await gh(''); if (!repo.permissions || !repo.permissions.push) throw Object.assign(new Error('no-push'), { status: 403 }); }
// one commit for any number of files: [{ path, text } | { path, blob }]
async function commitFiles(files, message) {
  const ref = await gh('/git/ref/heads/' + BRANCH), base = ref.object.sha, baseCommit = await gh('/git/commits/' + base);
  const tree = [];
  for (const f of files) {
    const content = f.blob ? b64(await f.blob.arrayBuffer()) : b64utf8(f.text);
    const bl = await gh('/git/blobs', { method: 'POST', body: JSON.stringify({ content, encoding: 'base64' }) });
    tree.push({ path: f.path, mode: '100644', type: 'blob', sha: bl.sha }); }
  const nt = await gh('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: baseCommit.tree.sha, tree }) });
  const nc = await gh('/git/commits', { method: 'POST', body: JSON.stringify({ message, tree: nt.sha, parents: [base] }) });
  await gh('/git/refs/heads/' + BRANCH, { method: 'PATCH', body: JSON.stringify({ sha: nc.sha }) }); }

/* ---------- lock / setup ---------- */
let KEYBOX = null;
const showBox = setup => { $('unlockBox').hidden = setup; $('setupBox').hidden = !setup; (setup ? $('tok') : $('pw')).focus(); };
$('toSetup').onclick = () => showBox(true); $('toUnlock').onclick = () => showBox(false);
try { const u = new URL($('tokLink').href); u.search = new URLSearchParams({ name: '복복이 건강수첩 관리', description: '건강수첩 링크 관리 페이지용 (이 저장소 파일 수정만)', target_name: OWNER, expires_in: '366', contents: 'write' }); $('tokLink').href = u; } catch (e) {}
async function unlock() { const pw = $('pw').value; if (!pw) return; const b = $('unlockBtn'); b.disabled = true; $('unlockErr').textContent = '';
  try { if (!KEYBOX) KEYBOX = await readKeyBox(); if (!KEYBOX) { $('unlockErr').textContent = '아직 등록된 열쇠가 없어요. 아래 "처음이에요"를 눌러 주세요.'; return; }
    try { TOKEN = await unlockToken(KEYBOX, pw); } catch (e) { $('unlockErr').textContent = '비밀번호가 달라요.'; return; }
    try { await checkToken(); } catch (e) { TOKEN = null; $('unlockErr').textContent = e.status === 401 ? '열쇠가 만료됐거나 지워졌어요. "열쇠 다시 등록하기"로 새 열쇠를 넣어 주세요.' : '열쇠로 저장소에 접근할 수 없어요 (' + (e.detail || e.message) + ')'; return; }
    try { sessionStorage.setItem('bb_admin', TOKEN); } catch (e) {}
    await enter();
  } finally { b.disabled = false; } }
$('unlockBtn').onclick = unlock; $('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
$('setupBtn').onclick = async () => { const tok = $('tok').value.trim(), p1 = $('pw1').value, p2 = $('pw2').value, er = $('setupErr'); er.textContent = '';
  if (!/^(github_pat_|ghp_)/.test(tok)) { er.textContent = 'github_pat_ 로 시작하는 열쇠를 붙여 넣어 주세요.'; return; }
  if (p1.length < 10 || !/[a-zA-Z]/.test(p1) || !/[0-9]/.test(p1)) { er.textContent = '비밀번호는 영문과 숫자를 섞어 10자 이상으로 해 주세요.'; return; }
  if (p1 !== p2) { er.textContent = '두 비밀번호가 서로 달라요.'; return; }
  const b = $('setupBtn'); b.disabled = true; b.textContent = '확인하는 중…';
  try { TOKEN = tok; await checkToken();
    KEYBOX = await lockToken(tok, p1); await commitFiles([{ path: KEY_PATH, text: JSON.stringify(KEYBOX, null, 2) + '\n' }], '건강수첩 관리: 열쇠 등록');

/* ---------- drag to reorder (touch + mouse) ---------- */
$('list').addEventListener('pointerdown', e => { const g = e.target.closest('.grip'); if (!g || view !== 'list') return; e.preventDefault();
  const el = g.closest('.card'), box = $('list'); el.classList.add('drag');
  const startY = e.clientY, startScroll = scrollY, base = el.offsetTop; let lastY = e.clientY, raf = 0;

let crop = null; // { img, zoom, ox, oy }
function drawCrop() { const c = $('cropCv'); if (!c) return; const g = c.getContext('2d'), S = c.width; g.fillStyle = '#e3f5ec'; g.fillRect(0, 0, S, S); if (!crop) return;
