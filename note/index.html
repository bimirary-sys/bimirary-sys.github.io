<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>복복이의 건강수첩</title>
<meta name="description" content="건강 고민별, 복복이의 생활 꿀팁을 쏙쏙. 영상 속 제품을 모아 둔 복복이의 건강수첩이에요.">
<meta property="og:title" content="복복이의 건강수첩 📒">
<meta property="og:description" content="건강 고민별, 복복이의 생활 꿀팁을 쏙쏙">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bimirary-sys.github.io/note/">
<meta name="theme-color" content="#cfeadd">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{--mint:#c4ead8;--mint2:#d8f1e6;--mintInk:#3d7a63;--lemon:#ffe57c;--lemonSoft:#fff4bf;--red:#ec8d86;--redSoft:#f6c3be;--cream:#fffdf6;--ink:#4a3a44;--sub:#8a7a84;--line:#d6ece2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mint2);color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif}
#app{position:fixed;inset:0;overflow:hidden}
.pc{display:none}
/* ---------- outside: floating notebook ---------- */
#intro{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 35%,#e9f8f1 0%,#cfeadd 60%,#bfe2d2 100%);z-index:1}
#intro.gone{visibility:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.cta{position:absolute;left:50%;top:70%;transform:translateX(-50%);z-index:2;border:0;background:none;cursor:pointer;padding:12px 18px;
  font:22px/1 Jua,sans-serif;color:var(--red);white-space:nowrap;letter-spacing:.01em;text-shadow:0 1px 0 rgba(255,255,255,.7);transition:opacity .3s}
.cta .up{display:inline-block;margin-left:1px;font-size:24px;transform:translateY(-3px);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-8px)}}
.cta.hide{opacity:0;pointer-events:none}
#flash{position:fixed;inset:0;z-index:4;background:var(--cream);opacity:0;pointer-events:none}
/* ---------- inside: the notebook page with the link list ---------- */
#note{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .28s ease;background:var(--lemonSoft)}
#scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#note.show{opacity:1;pointer-events:auto}
/* commission notice: one thin fixed line that drifts right to left (like Inpock) */
.disc{flex:none;position:relative;z-index:3;height:26px;overflow:hidden;background:#fff3c4;border-bottom:1px solid #f1dfa0;color:#7a6440;font-size:11px;line-height:26px;letter-spacing:-.01em;white-space:nowrap;contain:paint}
.disc .track{display:flex;width:max-content;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden}
.disc .track span{flex:none;padding-right:48px}
.paper{max-width:560px;margin:0 auto;min-height:calc(100% - 62px);background:
 linear-gradient(90deg,transparent 46px,#ffc2b8 46px,#ffc2b8 48px,transparent 48px),
 repeating-linear-gradient(transparent 0 35px,var(--line) 35px 36px),var(--cream);
 padding:16px 16px calc(env(safe-area-inset-bottom) + 36px) 62px;position:relative;box-shadow:inset 10px 0 24px -14px rgba(200,170,60,.35),0 0 40px rgba(60,90,80,.12)}
.paper:before{content:"";position:absolute;left:14px;top:20px;bottom:20px;width:18px;background:radial-gradient(circle at 9px 9px,var(--lemon) 6px,#e8d27a 6.5px,#e8d27a 7.5px,transparent 8px) 0 0/18px 54px repeat-y}
/* top bar outside the notebook page (like the toy box's "상자 밖으로") */
.topbar{max-width:560px;margin:0 auto;padding:12px 14px 10px}
.out{display:inline-flex;align-items:center;gap:6px;border:0;cursor:pointer;background:rgba(255,255,255,.78);color:var(--ink);font:15px Jua,sans-serif;padding:9px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(170,140,60,.18)}
.out:active{transform:translateY(2px);box-shadow:none}
h1{font-family:Jua,sans-serif;font-weight:400;font-size:28px;margin:10px 0 4px -46px;color:#e0705f;text-align:center}
.sub{color:var(--sub);font-size:14px;margin:0 0 20px -46px;text-align:center}
#list,.foot{max-width:480px;margin-left:auto;margin-right:auto}
.sec{margin:24px 0 10px;font:400 18px/1.4 Jua,sans-serif;color:var(--ink)}
.sec span{background:linear-gradient(transparent 55%,var(--mint) 55%);padding:0 2px}
.sec:first-child{margin-top:4px}
.links{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.links a{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;border:2px solid #f3df8f;background:#fffbe8;color:var(--ink);text-decoration:none;
  box-shadow:0 4px 0 rgba(236,141,134,.22),0 8px 16px rgba(160,130,60,.08);scroll-margin-top:70px;
  opacity:0;transform:translateY(14px);transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.3,.4,1)}
.links li.show a{opacity:1;transform:none}
.links a:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(236,141,134,.22)}
.links a:target,.links li:target a{outline:3px solid #ffb3a7}
.th{flex:none;position:relative;width:52px;height:52px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1.5px #f1e3ad}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th i{position:absolute;left:3px;top:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--mint);color:var(--mintInk);font:normal 12px/18px Jua,sans-serif;text-align:center}
.no{flex:none;width:32px;height:32px;border-radius:50%;background:var(--mint);color:var(--mintInk);font:17px/32px Jua,sans-serif;text-align:center}
.nm{flex:1;min-width:0;font:18px/1.25 Jua,sans-serif}
.nm small{display:block;margin-top:3px;font:13px "Gowun Dodum",sans-serif;color:var(--sub)}
.arr{flex:none;font:22px Jua,sans-serif;color:var(--red)}
.more{margin:26px 0 8px;font:16px Jua,sans-serif;color:var(--sub)}
.empty{text-align:center;padding:26px 10px;font-size:15px;color:var(--sub);background:#fffdf6;border-radius:16px;border:1.5px dashed #cfe6dc;margin-top:6px}
.empty b{display:block;font-family:Jua,sans-serif;font-weight:400;font-size:20px;color:var(--ink);margin-bottom:6px}
.foot{margin-top:28px;font-size:12px;line-height:1.7;color:var(--sub)}
.foot p{margin:6px 0}
@media (prefers-reduced-motion:reduce){.cta .up{animation:none}.disc{height:auto;white-space:normal;text-align:center;padding:5px 12px;line-height:1.45}.disc .track{width:auto;display:block}.disc .track span{padding:0}.links a{transition:opacity .2s;transform:none}}
/* PC: this is a phone site, so show it inside a phone-sized frame with a QR to open it on a phone */
@media (min-width:720px) and (min-height:560px){
  html,body{background:#d8f1e6 radial-gradient(circle at 50% 50%,rgba(255,255,255,.55) 2px,transparent 2.5px) 0 0/28px 28px}
  #app{inset:auto;left:50%;top:50%;width:400px;height:min(860px,calc(100vh - 48px));transform:translate(-50%,-50%);border-radius:36px;box-shadow:0 0 0 10px #fff,0 0 0 11px #cfe6dc,0 30px 70px rgba(60,110,90,.28)}
  .pc{display:flex;flex-direction:column;align-items:center;gap:10px;position:fixed;top:50%;left:calc(50% + 250px);transform:translateY(-50%);width:180px;text-align:center;color:var(--mintInk);font:15px/1.45 Jua,sans-serif}
  .pc .qr{width:150px;height:150px;padding:8px;background:#fff;border-radius:18px;box-shadow:0 8px 20px rgba(60,110,90,.18)}
  .pc .qr svg{display:block;width:100%;height:100%}
  .pc small{font:12px "Gowun Dodum",sans-serif;color:var(--sub)}
}
@media (min-width:720px) and (max-width:959px) and (min-height:560px){.pc{display:none}}
</style>
</head>
