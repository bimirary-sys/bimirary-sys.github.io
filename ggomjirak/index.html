#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;z-index:5}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
input{font-family:inherit}
.hide{display:none!important}
