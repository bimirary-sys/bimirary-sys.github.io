<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>복복이 장난감상자</title>
<meta name="description" content="복복이가 만든 무료 장난감 모음. 장난감상자를 톡 열면 몽글클리커와 복복이의 링크가 들어 있어요.">
<meta property="og:title" content="복복이 장난감상자 🧸">
<meta property="og:description" content="내가 좋아하는 거 만들어 · 전부 무료로 같이 갖고 놀게 해줄게">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bimirary-sys.github.io/">
<meta name="theme-color" content="#f6eff3">
<link rel="canonical" href="https://bimirary-sys.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  --bg1:#fbf4f1; --bg2:#efe8f6;
  --box:#f6b3c6; --dot:#fff4e3;          /* box body + polka dots */
  --lining:#fff0dc; --liningDot:rgba(239,140,170,.16);
  --ink:#4b3a3f; --sub:#9a7f86; --accent:#ec7fa1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Gowun Dodum",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2))}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
/* fixed caption under the box */
.cta{position:fixed;left:50%;transform:translateX(-50%);top:70%;z-index:3;border:0;background:none;cursor:pointer;padding:12px 18px;
  font:22px/1 Jua,sans-serif;color:var(--ink);white-space:nowrap;letter-spacing:.01em;transition:opacity .3s}
.cta .up{display:inline-block;margin-left:1px;font-size:24px;color:var(--accent);transform:translateY(-3px);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-8px)}}
.cta.hide{opacity:0;pointer-events:none}
/* inside the box: link list */
.inside{position:fixed;inset:0;z-index:5;opacity:0;pointer-events:none;transition:opacity .28s ease;
  background-color:var(--lining);
  background-image:radial-gradient(circle at center,var(--liningDot) 7px,transparent 7.5px),radial-gradient(circle at center,var(--liningDot) 7px,transparent 7.5px);
  background-size:52px 52px;background-position:0 0,26px 26px;
  box-shadow:inset 0 0 80px rgba(214,150,110,.22)}
.inside.on{opacity:1;pointer-events:auto}
.inner{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 28px)}
.out{display:inline-flex;align-items:center;gap:6px;border:0;cursor:pointer;background:rgba(255,255,255,.75);color:var(--ink);font:15px Jua,sans-serif;padding:10px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(200,120,140,.15)}
.inside h1{margin:22px 0 18px;font:400 28px/1.2 Jua,sans-serif;text-align:center;color:var(--ink)}
.links{list-style:none;margin:0 auto;padding:0;display:grid;gap:12px;max-width:480px}
.links a,.links button{width:100%;display:flex;align-items:center;gap:14px;padding:16px 16px;border-radius:20px;border:2px solid rgba(246,179,198,.55);
  background:#fffaf3;color:var(--ink);text-decoration:none;font:19px/1.25 Jua,sans-serif;text-align:left;cursor:pointer;
  box-shadow:0 4px 0 rgba(236,127,161,.18),0 10px 18px rgba(200,120,100,.08);
  opacity:0;transform:translateY(14px);transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.3,.4,1)}
.links .dot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--box);box-shadow:inset 0 0 0 6px var(--dot)}
.links .nm{flex:1;min-width:0}
.links small{display:block;margin-top:3px;font:13px "Gowun Dodum",sans-serif;color:var(--sub)}
.links .arr{flex:none;font-size:22px;color:var(--accent)}
.links .soon{opacity:.75}
.links .soon .arr{color:#c9b3ba}
.inside.on .links li.show a,.inside.on .links li.show button{opacity:1;transform:none}
.links a:active,.links button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(236,127,161,.18)}
.foot{margin:22px 0 0;text-align:center;font-size:12px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 40px);transform:translateX(-50%);z-index:9;background:rgba(75,58,63,.92);color:#fff;padding:11px 16px;border-radius:14px;font:15px Jua,sans-serif;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.on{opacity:1}
.fade{position:fixed;inset:0;z-index:4;background:var(--lining);opacity:0;pointer-events:none;transition:opacity .3s}
.fade.on{opacity:1}
</style>
</head>
<body>
<canvas id="gl" aria-label="땡땡이 무늬 장난감상자"></canvas>
<button class="cta" id="cta" type="button">복복이 장난감상자 열기<span class="up">^</span></button>
<div class="fade" id="fade"></div>
<section class="inside" id="inside" aria-label="복복이의 링크 모음" aria-hidden="true">
  <div class="inner">
    <button class="out" id="out" type="button">← 상자 밖으로</button>
    <h1>복복이의 링크 모음</h1>
    <ul class="links" id="links"></ul>
    <p class="foot">made by 복복이 🧸</p>
  </div>
</section>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
/* ================= 링크는 여기서만 바꾸면 돼요 =================
   name: 버튼에 보이는 이름 / desc: 작은 설명(없어도 됨) / url: 이동 주소 ('' 이면 준비중으로 표시) */
const LINKS = [
  { name: '몽글클리커', desc: '말랑한 3D 클리커 수십 종을 무료로 딸깍', url: '/mongleclicker/' },
  { name: '3D 집짓기', desc: '나만의 작은 집 짓기 · 준비중', url: '' },
  // { name: '인스타그램', desc: '@복복이', url: 'https://www.instagram.com/아이디/' },
  // { name: '유튜브', desc: '복복이 채널', url: 'https://www.youtube.com/@아이디' },
  // { name: '틱톡', desc: '복복이', url: 'https://www.tiktok.com/@아이디' },
];
/* ============================================================== */
(() => {
const T = THREE, $ = id => document.getElementById(id);
const canvas = $('gl'), cta = $('cta'), inside = $('inside'), fade = $('fade'), list = $('links'), toast = $('toast');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- link list ---------- */
LINKS.forEach(l => {
  const li = document.createElement('li'); const ok = !!l.url;
  const el = document.createElement(ok ? 'a' : 'button');
  if (ok) { el.href = l.url; if (/^https?:/.test(l.url) && !l.url.includes(location.host)) { el.target = '_blank'; el.rel = 'noopener'; } }
  else { el.type = 'button'; el.className = 'soon'; el.addEventListener('click', () => showToast(l.name + '는 지금 만드는 중이에요 🔨')); }
  el.innerHTML = '<span class="dot"></span><span class="nm"></span><span class="arr">' + (ok ? '→' : '🔒') + '</span>';
  el.querySelector('.nm').textContent = l.name;
  if (l.desc) { const s = document.createElement('small'); s.textContent = l.desc; el.querySelector('.nm').appendChild(s); }
  li.appendChild(el); list.appendChild(li);
});
let tt; function showToast(t) { toast.textContent = t; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 1800); }
function revealLinks() { [...list.children].forEach((li, i) => setTimeout(() => li.classList.add('show'), 70 + i * 70)); }
function hideLinks() { [...list.children].forEach(li => li.classList.remove('show')); }

/* ---------- renderer / scene ---------- */
const R = new T.WebGLRenderer({ canvas, antialias: true, alpha: true });
R.setPixelRatio(Math.min(2, devicePixelRatio || 1)); R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.05;
const S = new T.Scene(), cam = new T.PerspectiveCamera(35, 1, .02, 100);
S.add(new T.HemisphereLight(0xfff8f4, 0xe9dcef, .85));
const key = new T.DirectionalLight(0xfff3ea, .9); key.position.set(-3, 6, 5); S.add(key);
const rim = new T.DirectionalLight(0xffe6f0, .35); rim.position.set(4, 2, -3); S.add(rim);
const L = c => new T.Color(c).convertSRGBToLinear();
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- polka-dot material: dots live on a 3D lattice so they wrap over edges like print ---------- */
const S_STEP = .25, DOT_R = .085;
function dotMaterial(offset) {
  const m = new T.MeshPhysicalMaterial({ color: 0xffffff, roughness: .5, clearcoat: .35, clearcoatRoughness: .35 });
  m.userData.u = { uOff: { value: offset.clone() }, uBox: { value: L(css('--box')) }, uDot: { value: L(css('--dot')) }, uLin: { value: L(css('--lining')) }, uLinDot: { value: L('#f6bccc') }, uGlow: { value: 0 } };
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, m.userData.u);
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vOP; varying vec3 vON; uniform vec3 uOff;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvOP = position + uOff; vON = normal;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', [
      '#include <common>', 'varying vec3 vOP; varying vec3 vON;', 'uniform vec3 uBox; uniform vec3 uDot; uniform vec3 uLin; uniform vec3 uLinDot; uniform float uGlow;',
      'float dotDist(vec3 p){ vec3 q = p / ' + S_STEP.toFixed(3) + '; vec3 c = floor(q + 0.5); float best = 1e3;',
      ' for(int i=0;i<7;i++){ vec3 o = vec3(0.0); if(i==1)o.x=1.0; if(i==2)o.x=-1.0; if(i==3)o.y=1.0; if(i==4)o.y=-1.0; if(i==5)o.z=1.0; if(i==6)o.z=-1.0;',
      '  vec3 g = c + o; if(mod(g.x+g.y+g.z, 2.0) < 0.5){ best = min(best, length(q - g)); } }',
      ' return best * ' + S_STEP.toFixed(3) + '; }'
    ].join('\n'))
      .replace('vec4 diffuseColor = vec4( diffuse, opacity );', [
        'vec3 n = normalize(vON); bool inner = false;',
        'if (abs(n.y) < 0.5 && dot(n.xz, vOP.xz) < 0.0) inner = true;',
        'if (n.y > 0.5 && vOP.y < 1.2 && vOP.y > 0.02) inner = true;',
        'if (n.y < -0.5 && vOP.y > 1.2) inner = true;',
        'float d = dotDist(vOP); float aa = fwidth(d) * 1.2;',
        'vec3 col;',
        'if (inner) { float k = 1.0 - smoothstep(' + (DOT_R * .7).toFixed(3) + ' - aa, ' + (DOT_R * .7).toFixed(3) + ' + aa, d); col = mix(uLin, uLinDot, k * 0.85); }',
        'else { float k = 1.0 - smoothstep(' + DOT_R.toFixed(3) + ' - aa, ' + DOT_R.toFixed(3) + ' + aa, d); col = mix(uBox, uDot, k); }',
        'vec4 diffuseColor = vec4( col, opacity );'
      ].join('\n'))
      .replace('vec3 totalEmissiveRadiance = emissive;', 'vec3 totalEmissiveRadiance = emissive; { vec3 n2 = normalize(vON); bool inn = (abs(n2.y) < 0.5 && dot(n2.xz, vOP.xz) < 0.0) || (n2.y > 0.5 && vOP.y < 1.2) || (n2.y < -0.5 && vOP.y > 1.2); if (inn) totalEmissiveRadiance += vec3(1.0, 0.72, 0.42) * uGlow * (0.35 + 0.65 * clamp(vOP.y / 1.25, 0.0, 1.0)); }');
  };
  return m;
}

/* ---------- box geometry (in box space: body y 0..1.25, lid y 1.25..1.5) ---------- */
const BW = 2.0, BD = 1.5, BH = 1.25, LH = .25, WALL = .08, CR = .1;
function rrect(w, d, r, sh = new T.Shape()) { const x = -w / 2, y = -d / 2; sh.moveTo(x + r, y); sh.lineTo(x + w - r, y); sh.quadraticCurveTo(x + w, y, x + w, y + r); sh.lineTo(x + w, y + d - r); sh.quadraticCurveTo(x + w, y + d, x + w - r, y + d); sh.lineTo(x + r, y + d); sh.quadraticCurveTo(x, y + d, x, y + d - r); sh.lineTo(x, y + r); sh.quadraticCurveTo(x, y, x + r, y); return sh; }
function rpath(w, d, r) { const p = new T.Path(); const x = -w / 2, y = -d / 2; p.moveTo(x + r, y); p.quadraticCurveTo(x, y, x, y + r); p.lineTo(x, y + d - r); p.quadraticCurveTo(x, y + d, x + r, y + d); p.lineTo(x + w - r, y + d); p.quadraticCurveTo(x + w, y + d, x + w, y + d - r); p.lineTo(x + w, y + r); p.quadraticCurveTo(x + w, y, x + w - r, y); p.lineTo(x + r, y); return p; }
function extrudeUp(shape, h, y0, bevel) {
  const g = new T.ExtrudeGeometry(shape, bevel ? { depth: h - 2 * bevel, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 12 } : { depth: h, bevelEnabled: false, curveSegments: 12 });
  g.rotateX(-Math.PI / 2); g.translate(0, y0 + (bevel || 0), 0); g.computeVertexNormals(); return g;
}
const box = new T.Group(); S.add(box);
const tilt = new T.Group(); box.add(tilt);            // float / tilt / spin happen here
const body = new T.Group(); tilt.add(body); body.position.y = -BH * .6;   // centre the box on the pivot
const bodyMat = dotMaterial(new T.Vector3(0, 0, 0));
const ring = rrect(BW, BD, CR); ring.holes.push(rpath(BW - WALL * 2, BD - WALL * 2, CR * .5));
body.add(new T.Mesh(extrudeUp(ring, BH - .012, 0, 0), bodyMat));                        // walls (outside dotted, inside lining)
body.add(new T.Mesh(extrudeUp(rrect(BW - .002, BD - .002, CR), .1, 0, 0), bodyMat));     // floor
// lid: hinge on the back top edge
const hinge = new T.Group(); hinge.position.set(0, BH, -BD / 2); body.add(hinge);
const lidMat = dotMaterial(new T.Vector3(0, BH, -BD / 2));
const lidGeo = extrudeUp(rrect(BW - .04, BD - .04, CR - .02), LH, 0, .02); lidGeo.translate(0, 0, BD / 2);
hinge.add(new T.Mesh(lidGeo, lidMat));
// warm light inside + a glow card at the opening
const glowL = new T.PointLight(0xffc98a, 0, 3.2, 2); glowL.position.set(0, BH * .55, 0); body.add(glowL);
const gc = document.createElement('canvas'); gc.width = gc.height = 128; { const g = gc.getContext('2d'); const rg = g.createRadialGradient(64, 64, 4, 64, 64, 64); rg.addColorStop(0, 'rgba(255,186,110,1)'); rg.addColorStop(1, 'rgba(255,186,110,0)'); g.fillStyle = rg; g.fillRect(0, 0, 128, 128); }
const glowCard = new T.Mesh(new T.PlaneGeometry(BW * 1.15, BD * 1.15), new T.MeshBasicMaterial({ map: new T.CanvasTexture(gc), transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false }));
glowCard.rotation.x = -Math.PI / 2; glowCard.position.y = BH - .02; body.add(glowCard);
// soft floating shadow
const sc = document.createElement('canvas'); sc.width = sc.height = 128; { const g = sc.getContext('2d'); const rg = g.createRadialGradient(64, 64, 2, 64, 64, 64); rg.addColorStop(0, 'rgba(120,80,110,.35)'); rg.addColorStop(1, 'rgba(120,80,110,0)'); g.fillStyle = rg; g.fillRect(0, 0, 128, 128); }
const shadow = new T.Mesh(new T.PlaneGeometry(3, 2.2), new T.MeshBasicMaterial({ map: new T.CanvasTexture(sc), transparent: true, depthWrite: false })); shadow.rotation.x = -Math.PI / 2; shadow.position.y = -1.55; S.add(shadow);

/* ---------- camera rig ---------- */
const REST_YAW = -.55;
const C = { pos: new T.Vector3(), look: new T.Vector3(0, 0, 0), fov: 35 };
let C0 = new T.Vector3(), L0 = new T.Vector3(0, -.05, 0);
function layout() {
  const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h;
  const vf = 35 * Math.PI / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * cam.aspect);
  const want = 2.55;                                    // box footprint to fit across
  const dist = Math.max(want / .74 / 2 / Math.tan(hf / 2), 2.2 / .46 / 2 / Math.tan(vf / 2));
  C0.set(0, dist * .46, dist * .89); L0.set(0, -.08, 0);
  if (state === 'idle') { C.pos.copy(C0); C.look.copy(L0); C.fov = 35; }
  applyCam();
  // caption sits just under the box's resting silhouette
  const sv = tilt.rotation.y; tilt.rotation.set(0, REST_YAW, 0); tilt.position.y = 0; box.updateMatrixWorld(true);
  const bb = new T.Box3().setFromObject(body); let maxY = 0;
  for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) for (const z of [bb.min.z, bb.max.z]) { const v = new T.Vector3(x, y, z).project(cam); maxY = Math.max(maxY, (-v.y * .5 + .5) * h); }
  tilt.rotation.y = sv;
  cta.style.top = Math.min(h - 70, maxY + 18) + 'px';
}
function applyCam() { cam.position.copy(C.pos); cam.fov = C.fov; cam.updateProjectionMatrix(); cam.lookAt(C.look); cam.updateMatrixWorld(); }

/* ---------- motion helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, eOut = t => 1 - Math.pow(1 - t, 3), eBack = t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const bez = (a, b, c, t, out) => out.set(0, 0, 0).addScaledVector(a, (1 - t) * (1 - t)).addScaledVector(b, 2 * (1 - t) * t).addScaledVector(c, t * t);
const P1 = new T.Vector3(), P2 = new T.Vector3(), LK1 = new T.Vector3(), LK2 = new T.Vector3(), tmp = new T.Vector3(), tmp2 = new T.Vector3();
function insidePoints() {
  // positions in world space for the dive (box at rest, facing front)
  const top = -BH * .6 + BH;                           // world y of the rim
  P1.set(0, top + 2.2, BD * .5 + 1.35); LK1.set(0, top - .25, 0);
  P2.set(0, top - .32, BD * .5 - .55); LK2.set(0, -BH * .6 + .05, -BD * .5 + .05);
}

/* ---------- state machine ---------- */
let state = 'idle', t0 = 0, floatT = 0, yawFrom = REST_YAW;
function open() {
  if (state !== 'idle') return;
  state = 'opening'; t0 = performance.now(); cta.classList.add('hide'); insidePoints();
  if (reduce.matches) { fade.classList.add('on'); setTimeout(() => { setInsideScene(); showInside(); fade.classList.remove('on'); }, 320); }
}
function close() {
  if (state !== 'inside') return;
  state = 'closing'; t0 = performance.now(); inside.classList.remove('on'); inside.setAttribute('aria-hidden', 'true'); hideLinks();
  if (reduce.matches) { fade.classList.add('on'); setTimeout(() => { resetScene(); fade.classList.remove('on'); state = 'idle'; cta.classList.remove('hide'); }, 320); }
}
function showInside() { state = 'inside'; inside.classList.add('on'); inside.setAttribute('aria-hidden', 'false'); revealLinks(); inside.querySelector('.inner').scrollTop = 0; }
function setInsideScene() { tilt.rotation.set(0, 0, 0); tilt.position.y = 0; tilt.scale.set(1, 1, 1); hinge.rotation.x = -1.95; setGlow(1); C.pos.copy(P2); C.look.copy(LK2); C.fov = 58; applyCam(); }
function resetScene() { tilt.rotation.set(0, REST_YAW, 0); tilt.position.y = 0; tilt.scale.set(1, 1, 1); hinge.rotation.x = 0; setGlow(0); C.pos.copy(C0); C.look.copy(L0); C.fov = 35; applyCam(); }
function setGlow(k) { bodyMat.userData.u.uGlow.value = k * .12; lidMat.userData.u.uGlow.value = k * .12; glowL.intensity = k * .9; glowCard.material.opacity = k * .22; }
cta.addEventListener('click', open);
$('out').addEventListener('click', close);
const ray = new T.Raycaster(), ndc = new T.Vector2();
canvas.addEventListener('pointerdown', e => { if (state !== 'idle') return; ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, cam); if (ray.intersectObject(box, true).length) open(); });
addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

/* ---------- loop ---------- */
let last = performance.now();
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; floatT += dt;
  const fl = Math.sin(floatT * .9) * .12, tx = Math.sin(floatT * .7) * .05, tz = Math.sin(floatT * .55 + 1) * .06;
  if (state === 'idle') {
    tilt.position.y = fl; tilt.rotation.set(tx, REST_YAW + Math.sin(floatT * .4) * .06, tz); tilt.scale.set(1, 1, 1); yawFrom = tilt.rotation.y;
    shadow.scale.setScalar(1 - fl * .8); shadow.material.opacity = .9 - fl;
  } else if (state === 'opening' && !reduce.matches) {
    const t = (now - t0) / 1000;
    // 0 – .65 : squash, lift, one full turn ending face-on
    const sq = seg(t, 0, .12), rel = seg(t, .12, .3);
    const squash = Math.sin(sq * Math.PI * .5) * (1 - rel) * .1;
    tilt.scale.set(1 + squash * .6, 1 - squash, 1 + squash * .6);
    const sp = eIO(seg(t, .08, .65));
    tilt.rotation.y = yawFrom + (Math.PI * 2 - yawFrom) * sp;
