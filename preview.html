  const bd = painter(1024, 512, FUR, bs); bd.oval(0, belly[0], belly[1], belly[2], hex(LIGHT));
  const body = new T.Mesh(blobGeometry(parts, .08, [0, cy, 0], Rr, .032), painted(bd.tex())); bear.add(body);
  { const P = body.geometry.attributes.position.array, U = body.geometry.attributes.uv.array; for (let t = 0; t < P.length / 9; t++) { let out = false; for (let k = 0; k < 3; k++) { const i = t * 3 + k; if (Math.hypot(P[i * 3] / Rr[0], (P[i * 3 + 1] - cy) / Rr[1], P[i * 3 + 2] / Rr[2]) > 1.06) out = true; } if (out) for (let k = 0; k < 3; k++) { const i = t * 3 + k; U[i * 2] = .75; U[i * 2 + 1] = .5; } } }
  const HS = CUS.head, r0 = .92 * HS, hsc = [1.08, .93, .92], HR = hsc.map(v => v * r0);
  const head = new T.Group(); head.position.y = top + .38 + .78 * (HS - 1); bear.add(head);
  const F = { my: -.26, mrx: .38, mry: .27, ex: .36, ey: .07, erx: .07, ery: .085, ny: -.14, nrx: .06, nry: .042, mw: .043, mouthY: -.25, lw: .018 };
  F.erx *= CUS.eye; F.ery *= CUS.eye; F.ex *= CUS.gap; F.mw *= CUS.mouth; F.mrx *= CUS.muz * CUS.muzW; F.mry *= CUS.muz * CUS.muzH; F.mouthY = F.ny + (F.mouthY - F.ny) * CUS.nm; F.my += CUS.muzY; F.ny += CUS.nmY; F.mouthY += CUS.nmY;
  const hd = painter(2048, 1024, FUR, HR); hd.oval(0, F.my, F.mrx, F.mry, hex(LIGHT)); for (const s of [-1, 1]) hd.oval(s * F.ex, F.ey, F.erx, F.ery, INK); hd.oval(0, F.ny, F.nrx, F.nry, INK); hd.line(0, F.ny - F.nry * .5, 0, F.mouthY, F.lw); for (const s of [-1, 1]) hd.smile(s * F.mw, F.mouthY, F.mw, F.lw);
  const hm = new T.Mesh(new T.SphereGeometry(r0, 64, 48), painted(hd.tex())); hm.scale.set(...hsc); head.add(hm);
  for (const s of [-1, 1]) { const ear = new T.Mesh(new T.SphereGeometry(.27 * CUS.ear, 32, 24), furM); ear.position.set(s * .7 * HS * CUS.earGap, .66 * HS, -.06); ear.scale.set(1, 1, .8); head.add(ear); }
  bear.userData = { head, arms, headY: head.position.y };
  return bear;
}

/* ---------- toy box ---------- */
function rboxG(w, h, d, r) {
  const s = new T.Shape(), x = -w / 2 + r, y = -d / 2 + r, W = w - 2 * r, D = d - 2 * r;
  s.moveTo(x, y - r); s.lineTo(x + W, y - r); s.quadraticCurveTo(x + W + r, y - r, x + W + r, y); s.lineTo(x + W + r, y + D); s.quadraticCurveTo(x + W + r, y + D + r, x + W, y + D + r); s.lineTo(x, y + D + r); s.quadraticCurveTo(x - r, y + D + r, x - r, y + D); s.lineTo(x - r, y); s.quadraticCurveTo(x - r, y - r, x, y - r);
  const b = Math.min(r * .8, h * .45); const g = new T.ExtrudeGeometry(s, { depth: Math.max(.001, h - 2 * b), bevelEnabled: true, bevelSize: b * .9, bevelThickness: b, bevelSegments: 5, curveSegments: 10 });
  g.rotateX(-Math.PI / 2); g.translate(0, b, 0); g.computeVertexNormals(); return g;
}
function makeBox() {
  const box = new T.Group(), BW = 1.9, BH = 1.2, BD = 1.5;
  const mint = soft('#a9dcc8'), rib = soft('#f39bb5', { roughness: .4, clearcoat: .6 }), cream = soft('#fff4e2');
  // walls (open top)
  const t = .12;
  const wall = (w, h, d, x, z) => { const m = new T.Mesh(rboxG(w, h, d, .05), mint); m.position.set(x, 0, z); box.add(m); };
  wall(BW, BH, t, 0, BD / 2 - t / 2); wall(BW, BH, t, 0, -BD / 2 + t / 2); wall(t, BH, BD, BW / 2 - t / 2, 0); wall(t, BH, BD, -BW / 2 + t / 2, 0);
  const bottom = new T.Mesh(rboxG(BW, .1, BD, .05), mint); box.add(bottom);
  const inner = new T.Mesh(new T.PlaneGeometry(BW - .3, BD - .3), new T.MeshStandardMaterial({ color: L('#fff1c9'), emissive: L('#ffe7a8'), emissiveIntensity: 0 })); inner.rotation.x = -Math.PI / 2; inner.position.y = .12; box.add(inner);
  // ribbon around walls
  for (const s of [-1, 1]) { const r1 = new T.Mesh(new T.BoxGeometry(.24, BH + .01, .02), rib); r1.position.set(0, BH / 2, s * (BD / 2 + .005)); box.add(r1); const r2 = new T.Mesh(new T.BoxGeometry(.02, BH + .01, .24), rib); r2.position.set(s * (BW / 2 + .005), BH / 2, 0); box.add(r2); }
  // label on front
  const lc = document.createElement('canvas'); lc.width = 512; lc.height = 200; const lg = lc.getContext('2d'); lg.fillStyle = '#fffaf0'; lg.beginPath(); lg.roundRect(6, 6, 500, 188, 40); lg.fill(); lg.fillStyle = '#b07a52'; lg.font = '600 34px Jost, sans-serif'; lg.textAlign = 'center'; lg.fillText('BOKBOK', 256, 86); lg.fillStyle = '#e87b9c'; lg.font = '600 30px Jost, sans-serif'; lg.fillText('TOY BOX', 256, 140);
  const lt = new T.CanvasTexture(lc); lt.encoding = T.sRGBEncoding;
  const label = new T.Mesh(new T.PlaneGeometry(.62, .24), new T.MeshStandardMaterial({ map: lt, transparent: true, roughness: .8 })); label.position.set(-.52, BH * .5, BD / 2 + .015); box.add(label);
  // lid on a hinge at the back
  const hinge = new T.Group(); hinge.position.set(0, BH, -BD / 2); box.add(hinge);
  const lid = new T.Group(); lid.position.set(0, 0, BD / 2); hinge.add(lid);
  const lidM = new T.Mesh(rboxG(BW + .1, .22, BD + .1, .14), mint); lid.add(lidM);
  const lr1 = new T.Mesh(new T.BoxGeometry(.24, .235, BD + .12), rib); lr1.position.y = .11; lid.add(lr1); const lr2 = new T.Mesh(new T.BoxGeometry(BW + .12, .235, .24), rib); lr2.position.y = .11; lid.add(lr2);
  const bow = new T.Group(); bow.position.y = .26; lid.add(bow);
  for (const s of [-1, 1]) { const loop = new T.Mesh(new T.TorusGeometry(.2, .07, 14, 32), rib); loop.position.x = s * .2; loop.rotation.y = s * .5; loop.scale.set(1, .75, 1); bow.add(loop); const tail = new T.Mesh(new T.BoxGeometry(.1, .03, .38), rib); tail.position.set(s * .12, -.08, .2); tail.rotation.y = s * .45; bow.add(tail); }
  bow.add(new T.Mesh(new T.SphereGeometry(.09, 20, 16), rib));
  // glow light inside
  const glow = new T.PointLight(0xffd98a, 0, 4, 2); glow.position.set(0, .7, 0); box.add(glow);
  box.userData = { hinge, inner, glow, BH };
  return box;
}

const world = new T.Group(); S.add(world);
let bear, box;
const sparks = [];
function spark(n) {
  const cols = ['#ffd166', '#f7a9c0', '#a9dcc8', '#c7b5f2', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const m = new T.Mesh(new T.OctahedronGeometry(.06 + Math.random() * .05, 0), new T.MeshBasicMaterial({ color: L(cols[i % cols.length]) }));
    m.position.copy(box.position).add(new T.Vector3((Math.random() - .5) * 1, box.userData.BH + .1, (Math.random() - .5) * .8));
    m.userData = { v: new T.Vector3((Math.random() - .5) * 2.2, 3 + Math.random() * 2.2, (Math.random() - .5) * 1.6), life: 1.4 + Math.random() * .6, t: 0, spin: Math.random() * 8 };
    world.add(m); sparks.push(m);
  }
}

function layout() {
  const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h;
  const portrait = w / h < 1;
  // fit the pair (bear + box) — wider aspect = closer camera
  const need = 5.2, vfov = cam.fov * Math.PI / 180, hfov = 2 * Math.atan(Math.tan(vfov / 2) * cam.aspect);
  const dist = Math.max(need / 2 / Math.tan(hfov / 2), 3.6 / 2 / Math.tan(vfov / 2)) * (portrait ? 1.05 : 1.25);
  cam.position.set(0, dist * .42, dist); cam.lookAt(0, portrait ? -1.25 : -1.15, 0);
  cam.updateProjectionMatrix();
}

/* ---------- sound: soft "복복" ---------- */
let ac; const audio = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (ac && ac.state !== 'running') ac.resume(); return ac; };
function boop(delay = 0, f0 = 420) {
  const a = audio(); if (!a) return; const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
  o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * .55, t + .12);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.32, t + .012); g.gain.exponentialRampToValueAtTime(.001, t + .16);
  o.connect(lp); lp.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .2);
}
function chime() { const a = audio(); if (!a) return; [660, 880, 1175, 1568].forEach((f, i) => { const t = a.currentTime + i * .08, o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + .5); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .55); }); }

/* ---------- interaction ---------- */
const lines = ['복복!', '헤헤 간지러워 🧸', '말랑하지?', '또 눌러줘!', '상자 열어볼래?'];
let squash = 0, squashV = 0, li = 0;
function say(t) { bubble.textContent = t; bubble.style.opacity = 1; bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop'); }
const ray = new T.Raycaster(), ndc = new T.Vector2();
canvas.addEventListener('pointerdown', e => {
  if (!bear) return; ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, cam);
  if (ray.intersectObject(bear, true).length) { squashV -= 9; boop(0, 440); boop(.11, 360); say(lines[li++ % lines.length]); try { navigator.vibrate && navigator.vibrate(12); } catch (er) { } }
  else if (box && ray.intersectObject(box, true).length && state === 'idle') start();
});

let state = 'idle', st = 0;
function start() {
  if (state !== 'idle') return; state = 'spin'; st = 0; openBtn.classList.add('hide'); say(seen ? '다시 열어볼게!' : '두구두구…'); audio(); boop(0, 380); boop(.12, 300);
}
openBtn.addEventListener('click', start);
$('again').addEventListener('click', () => { sheet.classList.remove('show'); state = 'closing'; st = 0; });
const toast = $('toast'); let tt;
$('house').addEventListener('click', () => { toast.textContent = '3D 집짓기는 지금 열심히 만드는 중이에요 🔨'; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 1800); boop(0, 300); });

/* ---------- loop ---------- */
const ease = t => 1 - Math.pow(1 - t, 3), easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const v3 = new T.Vector3();
let last = performance.now();
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  if (bear) {
    // squishy spring
    squashV += (-squash * 220 - squashV * 14) * dt; squash += squashV * dt;
    const k = Math.max(-.25, Math.min(.25, squash * .06)); bear.scale.set(bs * (1 - k * .6), bs * (1 + k), bs * (1 - k * .6));
    bear.userData.head.rotation.z = Math.sin(t * 1.3) * .05; bear.userData.head.rotation.x = Math.sin(t * .9) * .03;
    bear.userData.arms.forEach((a, i) => a.rotation.z = (i ? 1 : -1) * (1.0 + Math.sin(t * 2 + i) * .06));
    // bubble follows head
    v3.set(0, bear.userData.headY + .95, 0); bear.localToWorld(v3); v3.project(cam);
    bubble.style.left = ((v3.x * .5 + .5) * innerWidth) + 'px'; bubble.style.top = ((-v3.y * .5 + .5) * innerHeight) + 'px';
  }
  if (box) {
    const ud = box.userData, fast = seen;
    if (state === 'idle') { box.rotation.y = -.35 + Math.sin(t * .8) * .04; box.position.y = -2 + Math.abs(Math.sin(t * 2.2)) * .03; }
    if (state === 'spin') {
      st += dt / (fast ? .55 : 1.25); const p = Math.min(1, st);
      box.rotation.y = -.35 + easeIO(p) * Math.PI * 2 * (fast ? 1 : 2); box.position.y = -2 + Math.sin(p * Math.PI) * (fast ? .35 : .7);
      const sq = 1 + Math.sin(p * Math.PI * 3) * .04; box.scale.set(bx * sq, bx / sq, bx * sq);
      if (p >= 1) { state = 'open'; st = 0; box.scale.set(bx, bx, bx); box.position.y = -2; squashV -= 6; chime(); spark(26); say('짜잔! 골라봐 ✨'); }
    }
    if (state === 'open') {
      st += dt / .5; const p = Math.min(1, st); ud.hinge.rotation.x = -ease(p) * 1.95; ud.glow.intensity = p * 2.2; ud.inner.material.emissiveIntensity = p * .6;
      if (p >= 1) { state = 'shown'; setTimeout(() => sheet.classList.add('show'), fast ? 100 : 350); try { localStorage.setItem('bokbok:opened', '1'); } catch (e) { } seen = true; }
    }
    if (state === 'closing') {
      st += dt / .35; const p = Math.min(1, st); ud.hinge.rotation.x = -(1 - ease(p)) * 1.95; ud.glow.intensity = (1 - p) * 2.2; ud.inner.material.emissiveIntensity = (1 - p) * .6;
      if (p >= 1) { state = 'idle'; openBtn.classList.remove('hide'); say('또 열어볼래?'); }
    }
    if (state === 'shown') { box.rotation.y = -.35 + Math.sin(t * .8) * .03; }
  }
  for (let i = sparks.length - 1; i >= 0; i--) { const m = sparks[i], u = m.userData; u.t += dt; u.v.y -= 6 * dt; m.position.addScaledVector(u.v, dt); m.rotation.x += u.spin * dt; m.rotation.y += u.spin * dt; const s = Math.max(0, 1 - u.t / u.life); m.scale.setScalar(s); if (u.t > u.life) { world.remove(m); m.geometry.dispose(); sparks.splice(i, 1); } }
  R.render(S, cam); requestAnimationFrame(tick);
}
let bs = .78, bx = 1;
addEventListener('resize', layout);
setTimeout(() => {
  bear = makeBear(); bear.position.set(-1.25, -2 * (1 - bs), .35); bear.rotation.y = .32; bear.scale.setScalar(bs); shadowAll(bear); world.add(bear);
  box = makeBox(); bx = .95; box.scale.setScalar(bx); box.position.set(1.05, -2, -.1); box.rotation.y = -.35; shadowAll(box); world.add(box);
  $('loading').remove(); layout(); requestAnimationFrame(tick);
  setTimeout(() => { bubble.style.opacity = 1; bubble.classList.add('pop'); }, 400);
}, 30);
})();
</script>
</body>
